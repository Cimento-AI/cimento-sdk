name: Release @cimento/webhooks

# A tag named typescript/webhooks/vX.Y.Z releases that version to npm. See
# RELEASING.md.
#
# The workflow only publishes from a public repository, and only for a tag.
# Anywhere else, and whenever it is started by hand, it is a dry run: it does
# everything up to the publish and stops.
on:
  push:
    tags:
      - "typescript/webhooks/v*"
  workflow_dispatch:

# One release of a tag at a time, and never cancelled part-way.
concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE: typescript/webhooks

jobs:
  # Everything CI checks of the package, on the tagged commit, and then the
  # tarball that will be published. This job has no credentials.
  check:
    name: Check and pack
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.mode.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0

      - name: Decide whether this is a release or a dry run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$PRIVATE" = "false" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "This is a release." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT" = "push" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "This is a dry run: the repository is private, and nothing is published from a private repository." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "This is a dry run: the workflow was started by hand, and only a tag releases." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version "$PACKAGE/package.json")" >> "$GITHUB_OUTPUT"

      - name: Require the tag to name the package's version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "$PACKAGE/v$VERSION" ]; then
            echo "::error::The tag is $TAG and package.json has version $VERSION, which is released by the tag $PACKAGE/v$VERSION."
            exit 1
          fi

      - name: Require a released commit to be on main
        if: steps.mode.outputs.release == 'true'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main. Only a commit on main is released."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache-dependency-path: internal/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: typescript/.node-version

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        working-directory: typescript
        run: pnpm lint

      # Typechecks, builds, and checks the package as it would be published.
      - name: Check packages
        working-directory: typescript
        run: pnpm -r lint

      - name: Test
        working-directory: typescript
        run: pnpm -r test

      - name: Check the event fixtures with both SDKs
        run: make check-fixtures

      - name: Pack
        working-directory: ${{ env.PACKAGE }}
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          echo "The files in the package:"
          tar -tzf "$RUNNER_TEMP"/package/*.tgz | sort

      - name: Keep the package for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # What a release would send to npm, without sending it.
  dry-run:
    name: Dry run
    needs: check
    if: needs.check.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Checkout the Node version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: typescript/.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/typescript/.node-version
          registry-url: https://registry.npmjs.org

      - name: Require an npm that can publish without a token
        run: |
          have="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $have cannot publish without a token. It takes npm 11.5.1 or newer."
            exit 1
          fi

      - name: Publish, as a dry run
        run: npm publish --dry-run --access public ./package/*.tgz

  # The release. It waits for an approval: the `release` environment has
  # required reviewers. npm trusts this workflow in that environment, so there
  # is no token; npm attaches the provenance itself.
  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # to create the GitHub release
      id-token: write # to prove to npm which workflow this is
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Checkout the Node version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: typescript/.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/typescript/.node-version
          registry-url: https://registry.npmjs.org

      # An older npm cannot publish without a token, and says so unclearly.
      - name: Require an npm that can publish without a token
        run: |
          have="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $have cannot publish without a token. It takes npm 11.5.1 or newer."
            exit 1
          fi

      # The path starts with ./ because npm reads "package/file" as a GitHub
      # repository to fetch.
      - name: Publish
        run: npm publish --access public ./package/*.tgz

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "@cimento/webhooks v$VERSION" \
            --notes "Published to npm as [@cimento/webhooks@$VERSION](https://www.npmjs.com/package/@cimento/webhooks/v/$VERSION)."
