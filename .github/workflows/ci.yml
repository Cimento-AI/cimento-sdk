name: CI

# Pushes to main, plus every pull request. Also registering push for every
# branch would run the suite twice for each push to a PR branch.
on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request cancels the run in flight for it. Pushes to main
# are keyed on the commit, so rapid merges cannot cancel each other's runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow runs on pull requests from forks, so it uses no secrets.
permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go the module supports, and the newest.
        go: ["1.26", "stable"]
    defaults:
      run:
        working-directory: go/webhooks
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/webhooks/go.mod

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: go/webhooks

      - name: Forbid init() in non-test Go files
        run: |
          if git grep -nE "^func init\(" -- '*.go' ':!*_test.go'; then
            echo "::error::init() is not allowed in this module"
            exit 1
          fi

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

  # The checks on the shared fixtures. This module is repository tooling and is
  # not part of any SDK, so it runs on one Go version.
  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: internal/go.sum

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: internal

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Test the release scripts
        run: ../.github/scripts/test.sh

      # The generated event types are committed. This fails when they are not
      # what the generator writes from the committed schema and fixtures.
      - name: Verify generated files are current
        run: |
          go run ./gen -root ..
          git diff --exit-code -- .. || {
            echo "::error::Generated files are stale. Run 'make generate' and commit the result."
            exit 1
          }

  # Both SDKs read every event fixture, and must make the same thing of each.
  # The other jobs test each SDK against the fixtures; this one tests them
  # against each other. `make test` runs it too.
  agreement:
    name: SDKs agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: internal/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Check the event fixtures with both SDKs
        run: make check-fixtures

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      # Typechecks, builds, and checks the package as it would be published.
      - name: Check packages
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  # The one check branch protection requires, so the matrices above can change
  # without the protection rule changing. It runs even when a job it needs has
  # failed: a skipped required check would count as passing.
  tests:
    name: Run Tests
    if: always()
    needs: [go, tooling, agreement, typescript]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        run: |
          echo "go: ${{ needs.go.result }}, tooling: ${{ needs.tooling.result }}, agreement: ${{ needs.agreement.result }}, typescript: ${{ needs.typescript.result }}"
          [ "${{ needs.go.result }}" = "success" ] && [ "${{ needs.tooling.result }}" = "success" ] && [ "${{ needs.agreement.result }}" = "success" ] && [ "${{ needs.typescript.result }}" = "success" ]
